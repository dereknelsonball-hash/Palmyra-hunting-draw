<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palmyra Hunting Club</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #14271d;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 16px;
      background: #233d2d;
      text-align: center;
    }
    h1 { margin-bottom: 8px; }
    p { color: #d0dfd2; line-height: 1.5; }
    input, button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      border: 1px solid #abb9ad;
      background: white;
      color: #172b1e;
    }
    button {
      border: none;
      background: #b8a36a;
      color: #14271d;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .hidden { display: none; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Palmyra Hunting Club</h1>
    <p>Member Hunting Draw</p>

    <section id="loginStep">
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Enter your email"
      >
      <button id="loginBtn">Email Me a Login Link</button>
    </section>

    <section id="welcomeStep" class="hidden">
      <h2 id="welcomeName">Welcome!</h2>
      <p>Your hunter login is working.</p>
      <p>The hunting draw screen will be added next.</p>
      <button id="logoutBtn">Log Out</button>
    </section>

    <p id="message" role="status" aria-live="polite">
      Checking login...
    </p>
  </main>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL =
      'https://hxmkjliyswxphcguwdrh.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_rG1_vYk-0uaCSk21eQt4vw_OfY-0I9O';

    const SITE_URL =
      'https://dereknelsonball-hash.github.io/Palmyra-hunting-draw/';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: true
        }
      }
    );

    const loginStep = document.getElementById('loginStep');
    const welcomeStep = document.getElementById('welcomeStep');
    const message = document.getElementById('message');
    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('email');

    function showLogin(text = '') {
      loginStep.classList.remove('hidden');
      welcomeStep.classList.add('hidden');
      message.textContent = text;
    }

    async function loadMember(user) {
      const { data, error } = await supabase
        .from('memberships')
        .select('display_name, active')
        .eq('user_id', user.id)
        .eq('active', true)
        .maybeSingle();

      if (error || !data) {
        await supabase.auth.signOut();
        showLogin(
          'Your email is not linked to an active Palmyra membership.'
        );
        return;
      }

      document.getElementById('welcomeName').textContent =
        'Welcome, ' + data.display_name;

      loginStep.classList.add('hidden');
      welcomeStep.classList.remove('hidden');
      message.textContent = '';
    }

    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();

      if (!email) {
        message.textContent = 'Please enter your email.';
        return;
      }

      loginBtn.disabled = true;
      message.textContent = 'Sending login link...';

      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: {
          shouldCreateUser: false,
          emailRedirectTo: SITE_URL
        }
      });

      loginBtn.disabled = false;

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent =
        'Check your email and click the login link. ' +
        'Return here if your email opens in another browser.';
    });

    document.getElementById('logoutBtn')
      .addEventListener('click', async () => {
        const { error } = await supabase.auth.signOut();

        if (error) {
          message.textContent = error.message;
          return;
        }

        showLogin('You have logged out.');
      });

    async function checkLogin() {
      const params = new URLSearchParams(window.location.search);
      const authError =
        params.get('error_description') ||
        params.get('error');

      if (authError) {
        showLogin(authError.replace(/\+/g, ' '));
        return;
      }

      const { data, error } = await supabase.auth.getUser();

      if (error || !data.user) {
        showLogin();
        return;
      }

      await loadMember(data.user);
    }

    await checkLogin();

    supabase.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_IN') {
        setTimeout(checkLogin, 0);
      }
    });
  </script>
</body>
</html>
